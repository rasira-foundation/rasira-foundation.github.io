<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Cache-busting: GitHub Pages serves index.html itself with far-future
         caching on some CDN edges, which can pin an old build's asset
         hashes (Vite fingerprints every JS/CSS file per build) and cause an
         intermittent blank screen once a later deploy's assets no longer
         match what the stale index.html references. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── SEO ──
         The title leads with the name, then the two phrases this site
         should actually be found on: what it is (a youth workforce
         development research collective) and where (Indonesia). The name
         alone was the whole title before, which only wins searches from
         people who already know the name — no use for reaching funders or
         partners who do not.

         Under ~60 characters so Google does not truncate it, and the
         description under ~155 for the same reason. The description is
         written to be READ, not stuffed: it names the audience (rural
         youth, first-generation jobseekers) and the method (field
         research, measurement), which are the terms a programme officer
         searches on. -->
    <title>Rasira Foundation | Youth Workforce Research, Indonesia</title>
    <meta
      name="description"
      content="Research-and-practice collective designing and measuring youth workforce programs in Indonesia — field research on rural and first-generation jobseekers."
    />
    <link rel="canonical" href="https://rasira-foundation.github.io/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph / Twitter. These are what render when the site is
         pasted into LinkedIn, WhatsApp or Slack — which for an
         organisation reaching funders and partners is a more common first
         impression than a Google result. Without them the preview falls
         back to a bare URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rasira Foundation" />
    <meta property="og:url" content="https://rasira-foundation.github.io/" />
    <meta property="og:title" content="Rasira Foundation | Youth Workforce Research, Indonesia" />
    <meta
      property="og:description"
      content="Research-and-practice collective designing and measuring youth workforce programs in Indonesia — field research on rural and first-generation jobseekers."
    />
    <meta property="og:image" content="https://rasira-foundation.github.io/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="An empty Indonesian classroom, desks and chairs in rows." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rasira Foundation | Youth Workforce Research, Indonesia" />
    <meta
      name="twitter:description"
      content="A research-and-practice collective designing and measuring youth workforce programs in Indonesia."
    />
    <meta name="twitter:image" content="https://rasira-foundation.github.io/og-image.jpg" />

    <!-- Structured data. This is the one piece of real, machine-readable
         content a crawler gets from this page today, since everything else
         is rendered by JavaScript — see the note in README/SEO. It is what
         lets a search engine understand this as an ORGANISATION with a
         focus and a contact, rather than as an untitled blank page.

         TODO: add a "sameAs" array of real profile URLs (LinkedIn, Instagram)
         once those exist. sameAs is how a search engine confirms this is the
         same organisation it sees elsewhere on the web, which is most of what
         makes a brand-name search resolve to you. An EMPTY sameAs array
         asserts nothing, so it is left out rather than shipped hollow. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["NGO", "ResearchOrganization"],
        "name": "Rasira Foundation",
        "url": "https://rasira-foundation.github.io/",
        "logo": "https://rasira-foundation.github.io/og-image.jpg",
        "image": "https://rasira-foundation.github.io/og-image.jpg",
        "email": "rasira.foundation@gmail.com",
        "description": "A research-and-practice collective designing and measuring youth workforce programs in Indonesia, focused on rural youth, first-generation jobseekers, and young people without strong credentials.",
        "areaServed": { "@type": "Country", "name": "Indonesia" },
        "knowsAbout": [
          "Youth workforce development",
          "Applied anthropology",
          "Human capital research",
          "Field-based program design",
          "Program monitoring and evaluation",
          "Possible selves",
          "Career self-efficacy",
          "Youth aspirations",
          "Youth employment",
          "First-generation jobseekers",
          "Rural youth",
          "Social mobility"
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The articles come from the Sheets gviz endpoint, and that request
         can only start once the JS bundle has parsed and mounted. Opening
         the connection here means DNS, TCP and TLS are already done by the
         time it fires, which is the single largest fixed cost in that
         round trip — the request itself is one small JSON response. -->
    <link rel="preconnect" href="https://docs.google.com" crossorigin />
    <!-- Fonts, loaded WITHOUT blocking first paint.

         `display=swap` is already in the URL, so the font files themselves
         never cause FOIT — text paints in the fallback face and swaps. But
         a plain <link rel="stylesheet"> is still render-blocking: the
         browser will not paint ANYTHING until this stylesheet resolves, and
         it is a third-party request. That is the delay before the hero text
         appears, not the font loading itself.

         preload starts the fetch at the highest priority; the media="print"
         trick lets the second link download without blocking (print styles
         are irrelevant to screen rendering), then onload promotes it to
         all. The noscript copy keeps it working with JS disabled. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Square+Peg&display=swap" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Square+Peg&display=swap"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Square+Peg&display=swap" />
    </noscript>

    <!-- CRITICAL CSS — inline on purpose, so it applies on the very first
         paint, before the bundle or any stylesheet has resolved.

         This is the fix for the background flashing ahead of the splash.
         The splash is a React component, so it cannot exist until the
         bundle parses and mounts; until then the browser paints whatever
         html/body say, and that used to be the page ground — so the
         gradient layers appeared first and the splash dropped in over them.
         Painting the splash's OWN top colour here means the first frame
         already looks like the splash, and the real component replaces an
         identical-looking surface rather than covering a different one.

         Values are duplicated from :root deliberately: this has to run
         before the stylesheet that defines those variables exists. -->
    <style>
      html,
      body {
        background: #ffffff;
      }
      /* Matches .splash's own gradient (--color-gradient-4 ->
         --color-atmos-haze-blue). Removed by the app once React has
         mounted — see main.tsx. */
      html.pre-mount,
      html.pre-mount body {
        background: linear-gradient(180deg, #ffffff 0%, #d8e2e9 100%);
      }

      /* The prerendered copy the build writes into #root (see the plugin in
         vite.config.ts). React's createRoot clears its container on first
         render, so in a normal visit this is replaced the instant the app
         mounts and is never seen.

         It is styled anyway, because the case where it survives is the case
         where it is the ONLY thing the visitor gets: JavaScript off, or the
         bundle failing to load. Then it should read as a plain, legible
         document rather than as full-bleed unstyled text.

         Hidden during pre-mount only, so it does not flash ahead of the
         splash. That hiding is deliberately keyed to a class a SCRIPT adds:
         with JavaScript off the class never appears and the content simply
         shows. The failsafe in the body covers the other case — script runs,
         bundle does not. */
      .static-shell {
        max-width: 66ch;
        margin: 0 auto;
        padding: 56px 24px;
        line-height: 1.6;
      }
      html.pre-mount .static-shell {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Set synchronously, before the module bundle is even requested, so
      // the very first paint uses the splash-coloured critical CSS above.
      // App.tsx clears it once the splash has finished.
      document.documentElement.classList.add('pre-mount');

      // Failsafe. `pre-mount` also hides the prerendered copy in #root, and
      // the only thing that normally removes the class is the React app. If
      // the bundle fails to load, or is blocked, nothing else ever would —
      // and the visitor would sit looking at an empty gradient while the
      // page's actual text was in the DOM the whole time. Six seconds is far
      // longer than the app needs on any real connection, and by the time it
      // fires in a healthy load React has already replaced #root, so there is
      // nothing left for it to reveal.
      setTimeout(function () {
        if (document.querySelector('#root .static-shell')) {
          document.documentElement.classList.remove('pre-mount');
        }
      }, 6000);
    </script>
    <!-- This site has never registered a service worker, but if a stale one
         from an earlier deploy (or a different tool) is still active in a
         visitor's browser, it can keep serving a cached, now-mismatched
         index.html/asset set indefinitely. Clearing any registration here
         is a one-time safety net, not something this site relies on. -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
